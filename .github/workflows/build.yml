name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev zlib1g-dev \
            gawk git gettext libssl-dev wget zstd

      - name: Download ImmortalWrt ImageBuilder
        run: |
          BUILD_URL="https://downloads.immortalwrt.org/snapshots/targets/armsr/armv8/immortalwrt-imagebuilder-armsr-armv8.Linux-x86_64.tar.zst"
          wget $BUILD_URL
          tar -I zstd -xvf immortalwrt-imagebuilder-*.tar.zst

      - name: Build Image
        run: |
          cd immortalwrt-imagebuilder-armsr-armv8.Linux-x86_64
          mkdir -p files/etc/uci-defaults
          wget -O files/etc/uci-defaults/01-init-settings \
            https://raw.githubusercontent.com/soapmancn/immortalwrt-workflow/main/.github/workflows/01-init-settings
          chmod +x files/etc/uci-defaults/01-init-settings
          make image PROFILE=generic \
          PACKAGES="luci luci-i18n-package-manager-zh-cn luci-i18n-base-zh-cn luci-i18n-firewall-zh-cn luci-i18n-ddns-go-zh-cn luci-app-ddns-go ddns-go luci-i18n-ddns-go-zh-cn openssh-sftp-server etherwake wireguard-tools kmod-wireguard luci-proto-wireguard kmod-nft-socket kmod-nft-tproxy sing-box hysteria" \
          FILES="files" \
          BIN_EXT=qcow2

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-image
          path: immortalwrt-imagebuilder/bin/targets/armsr/armv8/*.qcow2.gz

